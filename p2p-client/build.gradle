plugins {
    id 'application'
}

def osName = System.getProperty("os.name").toLowerCase()
def javafxPlatform = osName.contains("win") ? "win" : (osName.contains("mac") ? "mac" : "linux")
def javafxVersion = "21.0.6"

dependencies {
    implementation project(':p2p-common')

    // Standard Jackson for REST JSON communication
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    // JavaFX dependencies
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.project.p2p.client.P2pClientLauncher'
}
