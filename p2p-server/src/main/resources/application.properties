spring.application.name=p2p-coordination-server
server.port=${SERVER_PORT:8080}

# MariaDB Datasource Configuration
# Database name is fixed to 'test' per requirements, with fallback environment variables
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Safe JPA / Hibernate schema management - 'update' never drops tables or existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
